<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexDrive Academy | Real Skills. Real Confidence. Real Drivers.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Roboto', 'sans-serif'],
              display: ['Montserrat', 'sans-serif'],
            },
            colors: {
              nex: {
                blue: '#0066CC',
                green: '#68C132',
                navy: '#0B1325',
                grey: '#333333',
              },
            },
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0B1325;
        color: white;
        margin: 0;
        overflow-x: hidden;
      }

      /* Clean card style */
      .card {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        transition: all 0.3s ease;
      }
      .card:hover {
        background: rgba(255, 255, 255, 0.07);
        border-color: rgba(255, 255, 255, 0.15);
      }

      /* Brand gradient text */
      .text-brand-gradient {
        background: linear-gradient(135deg, #0066CC, #68C132);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Buttons */
      .btn-primary {
        background: #0066CC;
        transition: all 0.3s ease;
      }
      .btn-primary:hover {
        background: #0077EE;
        box-shadow: 0 4px 20px rgba(0, 102, 204, 0.35);
        transform: translateY(-1px);
      }
      .btn-green {
        background: #68C132;
        transition: all 0.3s ease;
      }
      .btn-green:hover {
        background: #76D13E;
        box-shadow: 0 4px 20px rgba(104, 193, 50, 0.35);
        transform: translateY(-1px);
      }
      .btn-outline {
        border: 1.5px solid rgba(255, 255, 255, 0.2);
        transition: all 0.3s ease;
      }
      .btn-outline:hover {
        border-color: rgba(255, 255, 255, 0.4);
        background: rgba(255, 255, 255, 0.05);
      }

      /* Green left accent */
      .accent-left {
        border-left: 3px solid #68C132;
      }

      /* Mobile menu animation */
      @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Smooth scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
